<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>马年大吉 - 动态贺卡生成器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            color: #fff;
            transition: background 0.5s ease;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .title h1 {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .floating-element {
            position: absolute;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
            will-change: transform, opacity;
        }

        .floating-element:nth-child(1) {
            width: 100px;
            height: 100px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-element:nth-child(2) {
            width: 80px;
            height: 80px;
            top: 60%;
            right: 15%;
            animation-delay: 2s;
        }

        .floating-element:nth-child(3) {
            width: 120px;
            height: 120px;
            bottom: 10%;
            left: 30%;
            animation-delay: 4s;
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffd700;
            border-radius: 50%;
            animation: sparkle 3s ease-in-out infinite;
            box-shadow: 0 0 10px 2px #ffd700;
        }

        @keyframes sparkle {
            0%, 100% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }
            50% {
                transform: scale(1) rotate(180deg);
                opacity: 1;
            }
        }

        .dynamic-line {
            position: absolute;
            width: 200px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.6), transparent);
            animation: lineMove 8s ease-in-out infinite;
        }

        @keyframes lineMove {
            0% {
                transform: translateX(-200px) rotate(45deg);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateX(calc(100vw + 200px)) rotate(45deg);
                opacity: 0;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0.3;
            }
            50% {
                transform: translateY(-20px) translateX(10px) scale(1.1);
                opacity: 0.6;
            }
        }

        .mouse-follower {
            position: fixed;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.6) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s ease-out, opacity 0.3s ease;
            will-change: transform;
        }

        .parallax {
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .parallax-layer {
            transition: transform 0.1s ease-out;
        }

        #card {
            position: relative;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #ffd700, #ff6b6b);
            opacity: 0;
            z-index: 1000;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .transition-overlay.active {
            opacity: 1;
        }

        #ui-container {
            text-align: center;
            margin: 60px 0 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .vertical-text {
            display: inline-block;
            writing-mode: vertical-rl;
            text-orientation: upright;
            margin: 0 20px;
        }

        .title h1 {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 80px;
            font-weight: bold;
            color: #ffd700;
            letter-spacing: 20px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            animation: titleAppear 2s ease-out;
        }

        .title h1 span {
            display: inline-block;
            animation: letterFloat 3s ease-in-out infinite;
        }

        .title h1 span:nth-child(1) { animation-delay: 0s; }
        .title h1 span:nth-child(2) { animation-delay: 0.5s; }
        .title h1 span:nth-child(3) { animation-delay: 1s; }
        .title h1 span:nth-child(4) { animation-delay: 1.5s; }

        @keyframes titleAppear {
            0% {
                opacity: 0;
                transform: translateY(100px) scale(0.5);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes letterFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .subtitle-group {
            margin-top: 20px;
        }

        .subtitle p {
            font-size: 24px;
            color: #fff;
            opacity: 0.8;
            animation: subtitleAppear 1s ease-out 1s both;
        }

        @keyframes subtitleAppear {
            0%, 100% {
                opacity: 0.8;
                transform: translateY(0);
            }
            50% {
                opacity: 1;
                transform: translateY(-10px);
            }
        }

        .countdown {
            font-size: 24px;
            color: #ffd700;
            margin-top: 40px;
            font-weight: 300;
            animation: countdownAppear 1s ease-out 1.5s both;
        }

        @keyframes countdownAppear {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .hint {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            color: rgba(255, 255, 255, 0.7);
            animation: hintAppear 1s ease-out 2s both;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }

        @keyframes hintAppear {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            100% {
                opacity: 0.7;
                transform: translateX(-50%) translateY(0);
            }
        }

        .stamp {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            border: none;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
            animation: stampPulse 2s ease-in-out infinite;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .stamp:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.6);
            animation: stampPulse 1s ease-in-out infinite;
        }

        .stamp:active {
            transform: scale(0.95);
        }

        @keyframes stampPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 8px 20px rgba(255, 107, 107, 0.6);
            }
        }

        .stamp span {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 36px;
            color: #fff;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .stamp:hover span {
            transform: scale(1.1) rotate(5deg);
        }

        .card-generator {
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 800px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: generatorAppear 1s ease-out 2.5s both;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 60px;
        }

        @keyframes generatorAppear {
            0% {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .generator-title {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
        }

        .form-input {
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-select {
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
            cursor: pointer;
        }

        .form-select:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.3);
        }

        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #333;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #4ecdc4, #45b7d1);
            color: #fff;
            box-shadow: 0 5px 15px rgba(78, 205, 196, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .card-preview {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            margin-top: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .preview-header {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .preview-content {
            width: 100%;
            height: 400px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            border-radius: 15px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.3);
        }

        .preview-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .preview-message {
            font-size: 24px;
            color: #fff;
            text-align: center;
            line-height: 1.8;
            z-index: 2;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            font-family: 'Ma Shan Zheng', cursive;
        }

        .preview-footer {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .preview-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .download-btn {
            background: #4ecdc4;
            color: #fff;
        }

        .share-btn {
            background: #45b7d1;
            color: #fff;
        }

        .preview-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 215, 0, 0.3);
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
            position: relative;
        }

        .spinner::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border: 2px solid rgba(255, 215, 0, 0.1);
            border-radius: 50%;
            animation: spin 2s linear infinite reverse;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading p {
            color: #ffd700;
            font-size: 18px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        @media (max-width: 768px) {
            .title h1 {
                font-size: 50px;
                letter-spacing: 10px;
            }

            #ui-container {
                margin: 40px 0 20px;
                padding: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            .card-generator {
                width: 95%;
                padding: 20px;
            }

            .preview-content {
                height: 300px;
                padding: 20px;
            }

            .stamp {
                bottom: 20px;
                right: 20px;
                width: 60px;
                height: 60px;
            }

            .stamp span {
                font-size: 24px;
            }

            .hint {
                bottom: 100px;
                font-size: 14px;
                padding: 8px 16px;
            }
        }

        @media (hover: none) and (pointer: coarse) {
            .stamp {
                animation: stampPulse 1.5s ease-in-out infinite;
            }

            .btn:active {
                transform: scale(0.95);
            }

            .preview-btn:active {
                transform: scale(0.95);
            }
        }
    </style>
</head>
<body>
    <div class="bg-decoration">
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="dynamic-line" style="top: 50%; left: 0; animation-delay: 2s;"></div>
    </div>

    <canvas class="particles-canvas" id="particlesCanvas"></canvas>

    <div class="transition-overlay" id="transitionOverlay"></div>

    <div id="card" class="parallax">
        <div id="stage"></div>
        <div class="mouse-follower" id="mouseFollower"></div>

        <div id="ui-container" class="parallax-layer">
            <div class="vertical-text title">
                <h1>
                    <span>马</span>
                    <span>到</span>
                    <span>成</span>
                    <span>功</span>
                </h1>
            </div>
            <div class="subtitle-group">
                <div class="vertical-text subtitle">
                    <p>迎春接福·万象更新</p>
                </div>
            </div>
            <div id="countdown" class="countdown"></div>
        </div>

        <div id="hint" class="hint">单击屏幕开始粒子跟随 · 双击屏幕切换跟随状态 · 拖拽鼠标创建粒子尾焰 · 甩动鼠标让粒子飞向四周 · 点击“福”开启音乐 · 点击“烟花”按钮放烟花</div>

        <button id="bgm-toggle" class="stamp" type="button" aria-label="背景音乐" aria-pressed="false">
            <span>福</span>
        </button>
        
        <button id="fireworks-toggle" class="stamp" style="bottom: 140px; right: 40px; background: linear-gradient(135deg, #ff6b6b, #ee5a6f);" type="button" aria-label="烟花效果">
            <span>烟花</span>
        </button>

        <div class="card-generator">
            <div class="generator-title">🎨 马年贺卡生成器</div>
            
            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label">收卡人称呼</label>
                    <input type="text" class="form-input" id="recipient" placeholder="例如：亲爱的朋友">
                </div>
                
                <div class="form-group">
                    <label class="form-label">祝福语（第一句）</label>
                    <input type="text" class="form-input" id="wish1" placeholder="例如：马到成功">
                </div>
                
                <div class="form-group">
                    <label class="form-label">祝福语（第二句）</label>
                    <input type="text" class="form-input" id="wish2" placeholder="例如：万事如意">
                </div>
                
                <div class="form-group">
                    <label class="form-label">祝福语（第三句）</label>
                    <input type="text" class="form-input" id="wish3" placeholder="例如：财源广进">
                </div>
                
                <div class="form-group">
                    <label class="form-label">落款</label>
                    <input type="text" class="form-input" id="signature" placeholder="例如：你的朋友">
                </div>
                
                <div class="form-group">
                    <label class="form-label">年份</label>
                    <input type="text" class="form-input" id="year" placeholder="例如：2026" value="2026">
                </div>
                
                <div class="form-group">
                    <label class="form-label">动画风格</label>
                    <select class="form-select" id="style">
                        <option value="classic">经典风格</option>
                        <option value="modern">现代风格</option>
                        <option value="cute">可爱风格</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">背景颜色</label>
                    <select class="form-select" id="bgColor">
                        <option value="red">红色</option>
                        <option value="gold">金色</option>
                        <option value="blue">蓝色</option>
                        <option value="purple">紫色</option>
                    </select>
                </div>
            </div>
            
            <div class="button-group">
                <button class="btn btn-primary" onclick="generateCard()">✨ 生成贺卡</button>
                <button class="btn btn-secondary" onclick="resetForm()">🔄 重置</button>
            </div>
            
            <div class="card-preview">
                <h3 class="preview-header">贺卡预览</h3>
                <div class="preview-content" id="previewContent">
                    <p class="preview-message" id="previewMessage">
                        亲爱的朋友<br>
                        马到成功<br>
                        万事如意<br>
                        财源广进<br>
                        你的朋友<br>
                        2026年
                    </p>
                </div>
                <div class="preview-footer">
                    <button class="preview-btn download-btn" onclick="downloadCard()">💾 下载</button>
                    <button class="preview-btn share-btn" onclick="shareCard()">📤 分享</button>
                </div>
            </div>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <p>加载中...</p>
        </div>

        <audio id="bgm" src="https://www.soundjay.com/music/mp3s/chinese-new-year.mp3" preload="auto" loop></audio>
    </div>

    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loading').classList.add('hidden');
                initParticleSystem();
                startCountdown();
            }, 2000);
        });

        function startCountdown() {
            const countdownElement = document.getElementById('countdown');
            const targetDate = new Date('2026-02-17 00:00:00');
            
            function updateCountdown() {
                const now = new Date();
                const diff = targetDate - now;
                
                if (diff <= 0) {
                    countdownElement.textContent = '新春快乐！';
                    return;
                }
                
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                
                countdownElement.textContent = `${days}天 ${hours}时 ${minutes}分 ${seconds}秒`;
            }
            
            updateCountdown();
            setInterval(updateCountdown, 1000);
        }

        class FireworksSystem {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.fireworks = [];
                this.particles = [];
                this.colors = ['#ffd700', '#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57', '#ff9ff3', '#54a0ff'];
                this.gravity = 0.2;
            }
            
            createFirework(x, y) {
                this.fireworks.push({
                    x: x,
                    y: y,
                    targetY: Math.random() * (this.canvas.height * 0.4) + 50,
                    speed: 8 + Math.random() * 4,
                    angle: -Math.PI / 2,
                    color: this.colors[Math.floor(Math.random() * this.colors.length)],
                    exploded: false,
                    trail: []
                });
            }
            
            update() {
                this.fireworks.forEach((firework, index) => {
                    firework.x += Math.cos(firework.angle) * firework.speed;
                    firework.y += Math.sin(firework.angle) * firework.speed;
                    
                    firework.trail.push({ x: firework.x, y: firework.y, alpha: 1 });
                    if (firework.trail.length > 20) {
                        firework.trail.shift();
                    }
                    
                    if (firework.y <= firework.targetY) {
                        this.createExplosion(firework.x, firework.y, firework.color);
                        this.fireworks.splice(index, 1);
                    }
                });
                
                this.particles.forEach((particle, index) => {
                    particle.speedY += this.gravity;
                    particle.x += particle.speedX;
                    particle.y += particle.speedY;
                    particle.speedX *= 0.98;
                    particle.speedY *= 0.98;
                    particle.life--;
                    
                    if (particle.life <= 0) {
                        this.particles.splice(index, 1);
                    }
                });
            }
            
            createExplosion(x, y, color) {
                const particleCount = 50 + Math.floor(Math.random() * 30);
                
                for (let i = 0; i < particleCount; i++) {
                    const angle = (Math.PI * 2 / particleCount) * i;
                    const speed = 2 + Math.random() * 4;
                    
                    this.particles.push({
                        x: x,
                        y: y,
                        speedX: Math.cos(angle) * speed,
                        speedY: Math.sin(angle) * speed,
                        color: color,
                        life: 100 + Math.random() * 50,
                        size: 2 + Math.random() * 2
                    });
                }
            }
            
            draw() {
                this.fireworks.forEach(firework => {
                    firework.trail.forEach((point, index) => {
                        const alpha = point.alpha * (index / firework.trail.length);
                        this.ctx.beginPath();
                        this.ctx.arc(point.x, point.y, 2, 0, Math.PI * 2);
                        this.ctx.fillStyle = firework.color;
                        this.ctx.globalAlpha = alpha;
                        this.ctx.fill();
                        this.ctx.globalAlpha = 1;
                    });
                    
                    this.ctx.beginPath();
                    this.ctx.arc(firework.x, firework.y, 4, 0, Math.PI * 2);
                    this.ctx.fillStyle = firework.color;
                    this.ctx.fill();
                });
                
                this.particles.forEach(particle => {
                    const alpha = particle.life / 150;
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    this.ctx.fillStyle = particle.color;
                    this.ctx.globalAlpha = alpha;
                    this.ctx.fill();
                    this.ctx.globalAlpha = 1;
                });
            }
            
            hexToRgb(hex) {
                hex = hex.replace('#', '');
                const r = parseInt(hex.substring(0, 2), 16);
                const g = parseInt(hex.substring(2, 4), 16);
                const b = parseInt(hex.substring(4, 6), 16);
                return `${r}, ${g}, ${b}`;
            }
        }

            darkenColor(color, amount) {
                color = color.replace('#', '');
                let r = parseInt(color.substring(0, 2), 16);
                let g = parseInt(color.substring(2, 4), 16);
                let b = parseInt(color.substring(4, 6), 16);
                
                r = Math.floor(r * (1 - amount));
                g = Math.floor(g * (1 - amount));
                b = Math.floor(b * (1 - amount));
                
                r = Math.max(0, Math.min(255, r));
                g = Math.max(0, Math.min(255, g));
                b = Math.max(0, Math.min(255, b));
                
                return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
            }
            
            bindEvents() {
                let clickTime = 0;
                
                document.addEventListener('mousemove', (e) => {
                    this.mouse.speed = Math.sqrt(
                        Math.pow(e.clientX - this.lastMouseX, 2) + 
                        Math.pow(e.clientY - this.lastMouseY, 2)
                    );
                    this.lastMouseX = e.clientX;
                    this.lastMouseY = e.clientY;
                    
                    this.mouse.x = e.clientX;
                    this.mouse.y = e.clientY;
                    this.isMouseActive = true;
                    this.mouse.isHovering = true;
                    
                    this.mouseTrail.push({ x: e.clientX, y: e.clientY, time: Date.now() });
                    if (this.mouseTrail.length > this.maxTrailLength) {
                        this.mouseTrail.shift();
                    }
                    
                    if (this.trails.length < this.maxTrails) {
                        this.createTrail(e.clientX, e.clientY);
                    }
                    
                    this.handleMouseInteraction(e.clientX, e.clientY);
                    
                    if (this.isDragging) {
                        this.dragEnd.x = e.clientX;
                        this.dragEnd.y = e.clientY;
                        const dx = e.clientX - this.dragStart.x;
                        const dy = e.clientY - this.dragStart.y;
                        this.dragDistance = Math.sqrt(dx * dx + dy * dy);
                        this.dragSpeed = this.mouse.speed;
                        this.createDragTrail(e.clientX, e.clientY);
                    }
                });
                
                document.addEventListener('mouseleave', () => {
                    this.isMouseActive = false;
                    this.isDragging = false;
                    this.mouse.isHovering = false;
                    this.lastDragX = null;
                    this.lastDragY = null;
                    this.mouseTrail = [];
                });
                
                document.addEventListener('mousedown', (e) => {
                    this.isDragging = true;
                    this.dragStart.x = e.clientX;
                    this.dragStart.y = e.clientY;
                    this.dragEnd.x = e.clientX;
                    this.dragEnd.y = e.clientY;
                    this.lastDragX = e.clientX;
                    this.lastDragY = e.clientY;
                    this.dragDistance = 0;
                    this.dragSpeed = 0;
                });
                
                document.addEventListener('mouseup', (e) => {
                    if (this.isDragging) {
                        const dx = e.clientX - this.dragStart.x;
                        const dy = e.clientY - this.dragStart.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < 5) {
                            const currentTime = new Date().getTime();
                            const timeSinceLastClick = currentTime - clickTime;
                            
                            if (timeSinceLastClick < 300) {
                                this.toggleFollowing(!this.isFollowing);
                                this.createDoubleClickEffect(e.clientX, e.clientY);
                            } else {
                                this.toggleFollowing(true);
                                this.handleClick(e.clientX, e.clientY);
                            }
                            
                            clickTime = currentTime;
                        } else {
                            this.createDragEndEffect(this.dragStart, this.dragEnd);
                            this.applySwingForce(this.dragStart, this.dragEnd);
                            this.isFollowing = false;
                            this.createDragEndStopEffect(e.clientX, e.clientY);
                        }
                        
                        this.isDragging = false;
                        this.lastDragX = null;
                        this.lastDragY = null;
                    }
                });
                
                document.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    this.isDragging = true;
                    this.dragStart.x = touch.clientX;
                    this.dragStart.y = touch.clientY;
                    this.dragEnd.x = touch.clientX;
                    this.dragEnd.y = touch.clientY;
                    this.lastDragX = touch.clientX;
                    this.lastDragY = touch.clientY;
                    this.lastMouseX = touch.clientX;
                    this.lastMouseY = touch.clientY;
                });
                
                document.addEventListener('touchmove', (e) => {
                    const touch = e.touches[0];
                    
                    this.mouse.speed = Math.sqrt(
                        Math.pow(touch.clientX - this.lastMouseX, 2) + 
                        Math.pow(touch.clientY - this.lastMouseY, 2)
                    );
                    this.lastMouseX = touch.clientX;
                    this.lastMouseY = touch.clientY;
                    
                    this.mouse.x = touch.clientX;
                    this.mouse.y = touch.clientY;
                    this.isMouseActive = true;
                    
                    if (this.isDragging) {
                        this.dragEnd.x = touch.clientX;
                        this.dragEnd.y = touch.clientY;
                        this.createDragTrail(touch.clientX, touch.clientY);
                    }
                });
                
                document.addEventListener('touchend', (e) => {
                    if (this.isDragging) {
                        const touch = e.changedTouches[0];
                        const dx = touch.clientX - this.dragStart.x;
                        const dy = touch.clientY - this.dragStart.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < 10) {
                            this.handleClick(touch.clientX, touch.clientY);
                        } else {
                            this.createDragEndEffect(this.dragStart, this.dragEnd);
                        }
                        
                        this.isDragging = false;
                        this.lastDragX = null;
                        this.lastDragY = null;
                    }
                });
                
                document.addEventListener('keydown', (e) => {
                    if (e.key === '1') {
                        this.theme = 'golden';
                        this.resetParticles();
                    } else if (e.key === '2') {
                        this.theme = 'neon';
                        this.resetParticles();
                    } else if (e.key === '3') {
                        this.theme = 'sunset';
                        this.resetParticles();
                    } else if (e.key === ' ') {
                        this.switchInteractionMode();
                    }
                });
            }
            
            handleMouseInteraction(x, y) {
                if (this.isFollowing) {
                    this.particles.forEach(particle => {
                        if (!particle.gravity) {
                            const dx = x - particle.x;
                            const dy = y - particle.y;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            
                            if (distance < this.mouse.radius) {
                                const forceDirectionX = dx / distance;
                                const forceDirectionY = dy / distance;
                                const force = (this.mouse.radius - distance) / this.mouse.radius;
                                let followForce = force * 0.8;
                                
                                switch (this.interactionMode) {
                                    case 'attract':
                                        particle.speedX += forceDirectionX * followForce * 4;
                                        particle.speedY += forceDirectionY * followForce * 4;
                                        break;
                                    case 'repel':
                                        particle.speedX -= forceDirectionX * followForce * 6;
                                        particle.speedY -= forceDirectionY * followForce * 6;
                                        break;
                                    case 'trail':
                                        if (this.mouseTrail.length > 5) {
                                            const trailPoint = this.mouseTrail[Math.floor(this.mouseTrail.length * 0.7)];
                                            const trailDx = trailPoint.x - particle.x;
                                            const trailDy = trailPoint.y - particle.y;
                                            const trailDistance = Math.sqrt(trailDx * trailDx + trailDy * trailDistance);
                                            if (trailDistance < this.mouse.radius) {
                                                const trailForceDirectionX = trailDx / trailDistance;
                                                const trailForceDirectionY = trailDy / trailDistance;
                                                const trailForce = (this.mouse.radius - trailDistance) / this.mouse.radius;
                                                particle.speedX += trailForceDirectionX * trailForce * 3;
                                                particle.speedY += trailForceDirectionY * trailForce * 3;
                                            }
                                        }
                                        break;
                                    case 'shape':
                                        const angle = Math.atan2(dy, dx);
                                        const targetDistance = this.mouse.radius * 0.6;
                                        const distanceDiff = targetDistance - distance;
                                        particle.speedX += Math.cos(angle) * distanceDiff * 0.02;
                                        particle.speedY += Math.sin(angle) * distanceDiff * 0.02;
                                        particle.speedX += -Math.sin(angle) * 3;
                                        particle.speedY += Math.cos(angle) * 3;
                                        break;
                                    case 'wave':
                                        const waveAngle = Math.atan2(dy, dx);
                                        const waveDistance = distance / this.mouse.radius;
                                        const waveForce = Math.sin(Date.now() * 0.003 + waveDistance * 5) * force * 0.5;
                                        particle.speedX += Math.cos(waveAngle) * waveForce * 4;
                                        particle.speedY += Math.sin(waveAngle) * waveForce * 4;
                                        break;
                                    case 'vortex':
                                        const vortexAngle = Math.atan2(dy, dx);
                                        const vortexDistance = distance / this.mouse.radius;
                                        const vortexForce = force * 0.8;
                                        particle.speedX += -Math.sin(vortexAngle) * vortexForce * 3;
                                        particle.speedY += Math.cos(vortexAngle) * vortexForce * 3;
                                        particle.speedX += Math.cos(vortexAngle) * vortexForce * 2;
                                        particle.speedY += Math.sin(vortexAngle) * vortexForce * 2;
                                        break;
                                    case 'gravity':
                                        const gravityForce = force * 1.2;
                                        particle.speedX += forceDirectionX * gravityForce * 8;
                                        particle.speedY += forceDirectionY * gravityForce * 8;
                                        break;
                                    case 'bounce':
                                        if (distance < this.mouse.radius * 0.3) {
                                            particle.speedX -= forceDirectionX * force * 10;
                                            particle.speedY -= forceDirectionY * force * 10;
                                        } else if (distance < this.mouse.radius) {
                                            particle.speedX += forceDirectionX * force * 3;
                                            particle.speedY += forceDirectionY * force * 3;
                                        }
                                        break;
                                }
                            }
                        }
                    });
                }
            }
            
            switchInteractionMode() {
                const modes = Object.keys(this.mouseModes);
                const currentIndex = modes.indexOf(this.interactionMode);
                const nextIndex = (currentIndex + 1) % modes.length;
                this.interactionMode = modes[nextIndex];
                
                const hint = document.getElementById('hint');
                if (hint) {
                    hint.textContent = `🎮 当前模式：${this.mouseModes[this.interactionMode]} | 按空格键切换模式 | 单击开始跟随 | 双击停止跟随 | 拖拽甩动粒子`;
                    setTimeout(() => {
                        hint.textContent = '🎮 交互提示：单击开始跟随 · 双击停止跟随 · 拖拽甩动粒子 · 按空格键切换交互模式 · 点击烟花按钮放烟花 · 鼠标悬停产生特效';
                    }, 3000);
                }
                
                this.createModeChangeEffect(this.mouse.x, this.mouse.y);
            }
            
            createModeChangeEffect(x, y) {
                const particleCount = 30;
                const colors = this.themes[this.theme].colors;
                
                for (let i = 0; i < particleCount; i++) {
                    const angle = (Math.PI * 2 / particleCount) * i;
                    const speed = Math.random() * 6 + 3;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    
                    this.particles.push({
                        ...this.createParticle(x, y),
                        speedX: Math.cos(angle) * speed,
                        speedY: Math.sin(angle) * speed,
                        color: color,
                        life: 1000,
                        maxLife: 1000,
                        glowIntensity: 2,
                        size: Math.random() * 2 + 1
                    });
                }
            }
            
            handleClick(x, y) {
                this.clickCount++;
                
                clearTimeout(this.clickTimer);
                this.clickTimer = setTimeout(() => {
                    this.clickCount = 0;
                    this.create闭环Effect(x, y);
                }, 3000);
                
                if (this.ripples.length < this.maxRipples) {
                    this.createRipple(x, y);
                }
                
                this.handleCombo();
                this.createClickEffect(x, y, this.clickCount);
            }
            
            createClickEffect(x, y, clickCount) {
                switch (clickCount) {
                    case 1:
                        this.createExplosion(x, y, 8, 'basic');
                        break;
                    case 2:
                        this.createRingExplosion(x, y);
                        break;
                    case 3:
                        this.createSpiralExplosion(x, y);
                        break;
                    case 4:
                        this.createStarExplosion(x, y);
                        break;
                    case 5:
                        this.switchTheme();
                        this.createFireworks(x, y);
                        break;
                    default:
                        const effects = ['ring', 'spiral', 'star', 'fireworks', 'basic'];
                        const randomEffect = effects[Math.floor(Math.random() * effects.length)];
                        switch (randomEffect) {
                            case 'ring':
                                this.createRingExplosion(x, y);
                                break;
                            case 'spiral':
                                this.createSpiralExplosion(x, y);
                                break;
                            case 'star':
                                this.createStarExplosion(x, y);
                                break;
                            case 'fireworks':
                                this.createFireworks(x, y);
                                break;
                            default:
                                this.createExplosion(x, y, 8, 'basic');
                            }
                        }
                    }
                }, 8, 'basic');
                            }
                        }
                    }
                }
                
                createExplosion(x, y, particleCount = 20, type = 'basic') {
                    const colors = this.themes[this.theme].colors;
                    
                    for (let i = 0; i < particleCount; i++) {
                        const angle = (Math.PI * 2 / particleCount) * i;
                        const speed = 3 + Math.random() * 3;
                        const color = colors[Math.floor(Math.random() * colors.length)];
                        
                        this.particles.push({
                            ...this.createParticle(x, y),
                            speedX: Math.cos(angle) * speed,
                            speedY: Math.sin(angle) * speed,
                            color: color,
                            life: 1000,
                            maxLife: 1000,
                            glowIntensity: 1.5,
                            size: Math.random() * 2 + 1
                        });
                    }
                }
                
                createRingExplosion(x, y) {
                    const particleCount = 40;
                    const radius = 30;
                    const colors = this.themes[this.theme].colors;
                    
                    for (let i = 0; i < particleCount; i++) {
                        const angle = (Math.PI * 2 / particleCount) * i;
                        const speed = 4 + Math.random() * 2;
                        const color = colors[Math.floor(Math.random() * colors.length)];
                        
                        this.particles.push({
                            ...this.createParticle(x, y),
                            speedX: Math.cos(angle) * speed,
                            speedY: Math.sin(angle) * speed,
                            color: color,
                            life: 1200,
                            maxLife: 1200,
                            glowIntensity: 2,
                            size: Math.random() * 1.5 + 0.5
                        });
                    }
                }
                
                createSpiralExplosion(x, y) {
                    const particleCount = 60;
                    const colors = this.themes[this.theme].colors;
                    
                    for (let i = 0; i < particleCount; i++) {
                        const angle = (Math.PI * 2 / particleCount) * i;
                        const radius = (i / particleCount) * 50;
                        const speed = 2 + Math.random() * 2;
                        const color = colors[Math.floor(Math.random() * colors.length)];
                        
                        this.particles.push({
                            ...this.createParticle(x, y),
                            speedX: (Math.cos(angle) * radius * 0.05) + (Math.cos(angle) * speed),
                            speedY: (Math.sin(angle) * radius * 0.05) + (Math.sin(angle) * speed),
                            color: color,
                            life: 1500,
                            maxLife: 1500,
                            glowIntensity: 2,
                            size: Math.random() * 1.5 + 0.5
                        });
                    }
                }
                
                createStarExplosion(x, y) {
                    const particleCount = 80;
                    const points = 8;
                    const colors = this.themes[this.theme].colors;
                    
                    for (let i = 0; i < particleCount; i++) {
                        const angle = (Math.PI * 2 / points) * Math.floor(i / (particleCount / points)) + (Math.random() * 0.2 - 0.1);
                        const speed = 4 + Math.random() * 3;
                        const color = colors[Math.floor(Math.random() * colors.length)];
                        
                        this.particles.push({
                            ...this.createParticle(x, y),
                            speedX: Math.cos(angle) * speed,
                            speedY: Math.sin(angle) * speed,
                            color: color,
                            life: 1800,
                            maxLife: 1800,
                            glowIntensity: 2.5,
                            size: Math.random() * 2 + 0.5
                        });
                    }
                }
                
                createFireworks(x, y) {
                    this.fireworksSystem.createFirework(x, y);
                }
                
                createRipple(x, y) {
                    this.ripples.push({
                        x: x,
                        y: y,
                        radius: 0,
                        maxRadius: 100,
                        alpha: 1,
                        color: this.themes[this.theme].colors[0]
                    });
                }
                
                createTrail(x, y) {
                    this.trails.push({
                        x: x,
                        y: y,
                        size: 2 + Math.random() * 2,
                        alpha: 1,
                        color: this.themes[this.theme].colors[Math.floor(Math.random() * this.themes[this.theme].colors.length)]
                    });
                }
                
                createDragTrail(x, y) {
                    if (this.trails.length < this.maxTrails) {
                        const trail = {
                            x: x,
                            y: y,
                            size: 3 + Math.random() * 3,
                            alpha: 1,
                            color: this.themes[this.theme].colors[Math.floor(Math.random() * this.themes[this.theme].colors.length)],
                            speed: this.mouse.speed * 0.1
                        };
                        this.trails.push(trail);
                    }
                }
                
                createDragEndEffect(start, end) {
                    const dx = end.x - start.x;
                    const dy = end.y - start.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const angle = Math.atan2(dy, dx);
                    
                    if (distance > 50) {
                        const particleCount = Math.min(30, Math.floor(distance / 5));
                        const colors = this.themes[this.theme].colors;
                        
                        for (let i = 0; i < particleCount; i++) {
                            const speed = 5 + Math.random() * 5;
                            const color = colors[Math.floor(Math.random() * colors.length)];
                            
                            this.particles.push({
                                ...this.createParticle(end.x, end.y),
                                speedX: Math.cos(angle) * speed,
                                speedY: Math.sin(angle) * speed,
                                color: color,
                                life: 1200,
                                maxLife: 1200,
                                glowIntensity: 2,
                                size: Math.random() * 2 + 1
                            });
                        }
                    }
                }
                
                createDragEndStopEffect(x, y) {
                    const particleCount = 15;
                    const colors = this.themes[this.theme].colors;
                    
                    for (let i = 0; i < particleCount; i++) {
                        const angle = (Math.PI * 2 / particleCount) * i;
                        const speed = 2 + Math.random() * 2;
                        const color = colors[Math.floor(Math.random() * colors.length)];
                        
                        this.particles.push({
                            ...this.createParticle(x, y),
                            speedX: Math.cos(angle) * speed,
                            speedY: Math.sin(angle) * speed,
                            color: color,
                            life: 800,
                            maxLife: 800,
                            glowIntensity: 1.5,
                            size: Math.random() * 1.5 + 0.5
                        });
                    }
                }
                
                createDoubleClickEffect(x, y) {
                    const particleCount = 25;
                    const colors = this.themes[this.theme].colors;
                    
                    for (let i = 0; i < particleCount; i++) {
                        const angle = (Math.PI * 2 / particleCount) * i;
                        const speed = 4 + Math.random() * 3;
                        const color = colors[Math.floor(Math.random() * colors.length)];
                        
                        this.particles.push({
                            ...this.createParticle(x, y),
                            speedX: Math.cos(angle) * speed,
                            speedY: Math.sin(angle) * speed,
                            color: color,
                            life: 1000,
                            maxLife: 1000,
                            glowIntensity: 2,
                            size: Math.random() * 2 + 0.5
                        });
                    }
                }
                
                create闭环Effect(x, y) {
                    const particleCount = 50;
                    const colors = this.themes[this.theme].colors;
                    
                    for (let i = 0; i < particleCount; i++) {
                        const angle = (Math.PI * 2 / particleCount) * i;
                        const speed = 3 + Math.random() * 2;
                        const color = colors[Math.floor(Math.random() * colors.length)];
                        
                        this.particles.push({
                            ...this.createParticle(x, y),
                            speedX: Math.cos(angle) * speed,
                            speedY: Math.sin(angle) * speed,
                            color: color,
                            life: 1500,
                            maxLife: 1500,
                            glowIntensity: 1.5,
                            size: Math.random() * 1.5 + 0.5
                        });
                    }
                }
                
                handleCombo() {
                    this.comboCount++;
                    
                    clearTimeout(this.comboTimer);
                    this.comboTimer = setTimeout(() => {
                        this.comboCount = 0;
                    }, 1000);
                    
                    if (this.comboCount >= 3) {
                        this.showComboEffect();
                    }
                }
                
                showComboEffect() {
                    if (this.comboElement) {
                        this.comboElement.textContent = `COMBO ${this.comboCount}!`;
                        this.comboElement.style.opacity = '1';
                        
                        setTimeout(() => {
                            this.comboElement.style.opacity = '0';
                        }, 1000);
                    }
                }
                
                switchTheme() {
                    const themes = Object.keys(this.themes);
                    const currentIndex = themes.indexOf(this.theme);
                    const nextIndex = (currentIndex + 1) % themes.length;
                    this.theme = themes[nextIndex];
                    
                    document.body.style.background = this.themes[this.theme].bg;
                    this.resetParticles();
                }
                
                resetParticles() {
                    this.particles = [];
                    for (let i = 0; i < this.particleCount; i++) {
                        this.particles.push(this.createParticle());
                    }
                }
                
                applySwingForce(start, end) {
                    const dx = end.x - start.x;
                    const dy = end.y - start.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const angle = Math.atan2(dy, dx);
                    const force = Math.min(distance * 0.1, 20);
                    
                    this.particles.forEach(particle => {
                        const particleDx = particle.x - end.x;
                        const particleDy = particle.y - end.y;
                        const particleDistance = Math.sqrt(particleDx * particleDx + particleDy * particleDy);
                        
                        if (particleDistance < this.mouse.radius) {
                            const influence = (this.mouse.radius - particleDistance) / this.mouse.radius;
                            const swingForce = force * influence * 2;
                            particle.speedX += Math.cos(angle) * swingForce;
                            particle.speedY += Math.sin(angle) * swingForce;
                        }
                    });
                }
                
                toggleFollowing(state) {
                    this.isFollowing = state;
                    
                    if (state) {
                        this.mouse.radius = 300;
                        this.showInteractionHint();
                    } else {
                        this.mouse.radius = 250;
                        this.showInteractionHint();
                    }
                }
                
                animate() {
                    const currentTime = performance.now();
                    const deltaTime = currentTime - this.lastFrameTime;
                    
                    if (deltaTime < this.minFrameInterval) {
                        this.animationFrame = requestAnimationFrame(() => this.animate());
                        return;
                    }
                    
                    this.lastFrameTime = currentTime;
                    
                    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                    
                    this.updateParticles();
                    this.drawParticles();
                    this.updateRipples();
                    this.drawRipples();
                    this.updateTrails();
                    this.drawTrails();
                    this.fireworksSystem.update();
                    this.fireworksSystem.draw();
                    
                    this.animationFrame = requestAnimationFrame(() => this.animate());
                }
                
                updateParticles() {
                    this.particles.forEach((particle, index) => {
                        particle.life -= 16;
                        
                        if (particle.life <= 0) {
                            this.particles.splice(index, 1);
                            if (this.particles.length < this.particleCount) {
                                this.particles.push(this.createParticle());
                            }
                            return;
                        }
                        
                        if (this.isFollowing) {
                            const dx = this.mouse.x - particle.x;
                            const dy = this.mouse.y - particle.y;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            
                            if (distance < this.mouse.radius) {
                                const forceDirectionX = dx / distance;
                                const forceDirectionY = dy / distance;
                                const force = (this.mouse.radius - distance) / this.mouse.radius;
                                let followForce = force * 0.8;
                                
                                particle.speedX += forceDirectionX * followForce * 6;
                                particle.speedY += forceDirectionY * followForce * 6;
                            }
                        }
                        
                        particle.speedX *= particle.friction;
                        particle.speedY *= particle.friction;
                        
                        particle.x += particle.speedX;
                        particle.y += particle.speedY;
                        
                        this.handleWallCollision(particle);
                    });
                }
                
                handleWallCollision(particle) {
                    const bounceFactor = 0.8;
                    
                    if (particle.x < 0) {
                        particle.x = 0;
                        particle.speedX = Math.abs(particle.speedX) * bounceFactor;
                    } else if (particle.x > this.canvas.width) {
                        particle.x = this.canvas.width;
                        particle.speedX = -Math.abs(particle.speedX) * bounceFactor;
                    }
                    
                    if (particle.y < 0) {
                        particle.y = 0;
                        particle.speedY = Math.abs(particle.speedY) * bounceFactor;
                    } else if (particle.y > this.canvas.height) {
                        particle.y = this.canvas.height;
                        particle.speedY = -Math.abs(particle.speedY) * bounceFactor;
                    }
                }
                
                drawParticles() {
                    this.particles.forEach(particle => {
                        const alpha = particle.life / particle.maxLife;
                        
                        this.ctx.save();
                        this.ctx.globalAlpha = alpha;
                        
                        const gradient = this.ctx.createRadialGradient(
                            particle.x, particle.y, 0,
                            particle.x, particle.y, particle.size * 3
                        );
                        gradient.addColorStop(0, particle.color);
                        gradient.addColorStop(0.5, particle.color);
                        gradient.addColorStop(1, 'transparent');
                        
                        this.ctx.beginPath();
                        this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                        this.ctx.fillStyle = gradient;
                        this.ctx.fill();
                        
                        if (particle.glowIntensity > 1) {
                            this.ctx.shadowColor = particle.color;
                            this.ctx.shadowBlur = 10 * particle.glowIntensity;
                            this.ctx.shadowOffsetX = 0;
                            this.ctx.shadowOffsetY = 0;
                            
                            this.ctx.beginPath();
                            this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                            this.ctx.fillStyle = particle.color;
                            this.ctx.fill();
                        }
                        
                        this.ctx.restore();
                    });
                }
                
                updateRipples() {
                    this.ripples.forEach((ripple, index) => {
                        ripple.radius += 2;
                        ripple.alpha -= 0.02;
                        
                        if (ripple.alpha <= 0) {
                            this.ripples.splice(index, 1);
                        }
                    });
                }
                
                drawRipples() {
                    this.ripples.forEach(ripple => {
                        this.ctx.save();
                        this.ctx.globalAlpha = ripple.alpha;
                        this.ctx.strokeStyle = ripple.color;
                        this.ctx.lineWidth = 2;
                        this.ctx.beginPath();
                        this.ctx.arc(ripple.x, ripple.y, ripple.radius, 0, Math.PI * 2);
                        this.ctx.stroke();
                        this.ctx.restore();
                    });
                }
                
                updateTrails() {
                    this.trails.forEach((trail, index) => {
                        trail.alpha -= 0.03;
                        
                        if (trail.alpha <= 0) {
                            this.trails.splice(index, 1);
                        }
                    });
                }
                
                drawTrails() {
                    this.trails.forEach(trail => {
                        this.ctx.save();
                        this.ctx.globalAlpha = trail.alpha;
                        
                        const gradient = this.ctx.createRadialGradient(
                            trail.x, trail.y, 0,
                            trail.x, trail.y, trail.size * 2
                        );
                        gradient.addColorStop(0, trail.color);
                        gradient.addColorStop(0.5, trail.color);
                        gradient.addColorStop(1, 'transparent');
                        
                        this.ctx.beginPath();
                        this.ctx.arc(trail.x, trail.y, trail.size, 0, Math.PI * 2);
                        this.ctx.fillStyle = gradient;
                        this.ctx.fill();
                        this.ctx.restore();
                    });
                }
            }
            
            function initParticleSystem() {
                new ParticleSystem();
            }
            
            document.addEventListener('DOMContentLoaded', function() {
                const bgm = document.getElementById('bgm');
                const bgmToggle = document.getElementById('bgm-toggle');
                const fireworksToggle = document.getElementById('fireworks-toggle');
                
                if (bgmToggle) {
                    bgmToggle.addEventListener('click', function() {
                        if (bgm.paused) {
                            bgm.volume = 0.3;
                            bgm.play().catch(e => console.log('Audio autoplay prevented:', e));
                            this.setAttribute('aria-pressed', 'true');
                        } else {
                            bgm.pause();
                            this.setAttribute('aria-pressed', 'false');
                        }
                    });
                }
                
                if (fireworksToggle) {
                    fireworksToggle.addEventListener('click', function() {
                        const particleSystem = window.particleSystem;
                        if (particleSystem) {
                            particleSystem.createFireworks(Math.random() * window.innerWidth, Math.random() * window.innerHeight);
                        }
                    });
                }
            });
            
            function generateCard() {
                const recipient = document.getElementById('recipient').value || '亲爱的朋友';
                const wish1 = document.getElementById('wish1').value || '马到成功';
                const wish2 = document.getElementById('wish2').value || '万事如意';
                const wish3 = document.getElementById('wish3').value || '财源广进';
                const signature = document.getElementById('signature').value || '你的朋友';
                const year = document.getElementById('year').value || '2026';
                const style = document.getElementById('style').value;
                const bgColor = document.getElementById('bgColor').value;
                
                const previewMessage = document.getElementById('previewMessage');
                const previewContent = document.getElementById('previewContent');
                
                previewMessage.innerHTML = `${recipient}<br>${wish1}<br>${wish2}<br>${wish3}<br>${signature}<br>${year}年`;
                
                const bgColors = {
                    red: 'linear-gradient(135deg, #ff6b6b, #ee5a6f)',
                    gold: 'linear-gradient(135deg, #ffd700, #ffed4e)',
                    blue: 'linear-gradient(135deg, #4ecdc4, #45b7d1)',
                    purple: 'linear-gradient(135deg, #9b59b6, #8e44ad)'
                };
                
                previewContent.style.background = bgColors[bgColor] || bgColors.red;
            }
            
            function resetForm() {
                document.getElementById('recipient').value = '';
                document.getElementById('wish1').value = '';
                document.getElementById('wish2').value = '';
                document.getElementById('wish3').value = '';
                document.getElementById('signature').value = '';
                document.getElementById('year').value = '2026';
                document.getElementById('style').value = 'classic';
                document.getElementById('bgColor').value = 'red';
                
                generateCard();
            }
            
            function downloadCard() {
                const previewContent = document.getElementById('previewContent');
                html2canvas(previewContent).then(canvas => {
                    const link = document.createElement('a');
                    link.download = '马年贺卡.png';
                    link.href = canvas.toDataURL();
                    link.click();
                });
            }
            
            function shareCard() {
                if (navigator.share) {
                    navigator.share({
                        title: '马年贺卡',
                        text: '祝你马年大吉，万事如意！',
                        url: window.location.href
                    });
                } else {
                    navigator.clipboard.writeText(window.location.href).then(() => {
                        alert('链接已复制到剪贴板，快来分享给朋友吧！');
                    });
                }
            }
        </script>
